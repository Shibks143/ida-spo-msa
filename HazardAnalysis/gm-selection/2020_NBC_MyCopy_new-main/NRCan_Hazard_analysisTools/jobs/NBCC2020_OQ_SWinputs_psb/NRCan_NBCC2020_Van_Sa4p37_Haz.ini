[general]

description = (PSB, Hazard, Vancouver, BRBGF, Config-A, 20-St) SWCan 2020 NBCC Hazard - 450 mps COLLAPSED RATES, simplified Eastern GMPEs, 10 km area src disc
calculation_mode = classical
# calculation_mode = disaggregation
random_seed = 23

[geometry]

# sites_csv = NBCC2020selected_swcan_sites.csv # (psb, 11-24-21)
# sites_csv = swcan_sites.csv
# sites_csv = ..\..\shared\swcan_singleSite_psb.csv
# sites_csv = swcan_fiveSites_psb.csv
sites = -123.12 49.25

[logic_tree]

number_of_logic_tree_samples = 0
#number_of_logic_tree_samples = 65000    May be needed for W Canada runs

[erf]

rupture_mesh_spacing = 5.0
width_of_mfd_bin = 0.1
area_source_discretization = 10.0
# area_source_discretization Could be set to 5 if run on Australian NCI

[site_params]

reference_vs30_type = measured
reference_vs30_value = 450.0
reference_depth_to_2pt5km_per_sec = 5.0
reference_depth_to_1pt0km_per_sec = 100.0

[calculation]

source_model_logic_tree_file = SW_CANADA_CIS_update_collapsed_source_model_logic_tree.xml
gsim_logic_tree_file = ..\..\shared\hdf_NBCC2020-W_reducedE_450mps_logic_tree.xml

# (PSB, 11-25-21) trial run with coarse IM value. Also, SA(10.0) removed.
intensity_measure_types_and_levels = {"PGA":  logscale(0.01,4.0, 20),
                                      "SA(0.1)":  logscale(0.01,4.0, 20),
                                      "SA(0.2)":  logscale(0.01,4.0, 20),
                                      "SA(0.5)":  logscale(0.01,4.0, 20),
                                      "SA(1.0)":  logscale(0.01,4.0, 20),
                                      "SA(2.0)":  logscale(0.01,4.0, 20),
                                      "SA(5.0)":  logscale(0.01,4.0, 20),
									  "SA(4.37)":  logscale(0.01,4.0, 20)}
truncation_level = 3
investigation_time = 50.0
#maximum_distance = {'Stable Shallow Crust': [(5, 50), (5.5, 100), (6, 200), (10,600)] }
# maximum_distance = 400.0
maximum_distance = {"Active Shallow Crust": 400.0, "Stable Shallow Crust": 600.0, "Subduction IntraSlab30": 400, "Subduction IntraSlab55": 400, "Subduction Interface": 1000.0} # from AU model
#if run on Australian NCI

# [disaggregation]
# 
# poes_disagg = 0.02
# mag_bin_width = 0.10
# distance_bin_width = 20.0
# coordinate_bin_width = 2.0
# num_epsilon_bins = 3

[output]

export_dir = ./results
hazard_maps = false
uniform_hazard_spectra = true
mean_hazard_curves = true
quantile_hazard_curves = 0.01 0.05 0.10 0.16 0.50 0.84 0.90 0.95 0.99
poes = 0.02 0.1 0.2

# individual_rlzs = true